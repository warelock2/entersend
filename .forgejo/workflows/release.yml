name: Build APK (Forgejo)

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    runs-on: docker
    container:
      image: stden/android:latest
    steps:
      - name: Checkout code
        run: |
          git init
          git remote add origin "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}.git"
          git fetch --depth=1 origin "$GITHUB_SHA"
          git checkout --detach FETCH_HEAD

      - name: Install Gradle 8.2
        run: |
          curl -fsSL https://services.gradle.org/distributions/gradle-8.2-bin.zip -o /tmp/gradle.zip
          unzip -q /tmp/gradle.zip -d /tmp

      - name: Install JDK 17
        run: |
          curl -fsSL https://api.adoptium.net/v3/binary/latest/17/ga/linux/x64/jdk/hotspot/normal/eclipse -o /tmp/jdk17.tar.gz
          mkdir -p /opt/jdk17
          tar -xzf /tmp/jdk17.tar.gz --strip-components=1 -C /opt/jdk17
          echo "JAVA_HOME=/opt/jdk17" >> "$GITHUB_ENV"
          echo "PATH=/opt/jdk17/bin:$PATH" >> "$GITHUB_ENV"

      - name: Build Debug APK
        run: /tmp/gradle-8.2/bin/gradle --no-daemon assembleDebug

      - name: Create Forgejo release and upload APK
        env:
          FORGEJO_TOKEN: ${{ github.token }}
        run: |
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            RELEASE_TAG="$GITHUB_REF_NAME"
          else
            RELEASE_TAG="manual-$GITHUB_RUN_ID"
          fi
          RELEASE_JSON=$(printf '{"tag_name":"%s","name":"EnterSend %s","draft":false}' "$RELEASE_TAG" "$RELEASE_TAG")
          RELEASE_ID=$(curl --fail-with-body -sS -X POST \
            -H "Authorization: token $FORGEJO_TOKEN" \
            -H "Content-Type: application/json" \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/releases" \
            -d "$RELEASE_JSON" | python3 -c 'import json,sys; print(json.load(sys.stdin)["id"])')
          curl --fail-with-body -sS -X POST \
            -H "Authorization: token $FORGEJO_TOKEN" \
            -H "Content-Type: application/vnd.android.package-archive" \
            --data-binary @app/build/outputs/apk/debug/app-debug.apk \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID/assets?name=entersend-$RELEASE_TAG.apk"
