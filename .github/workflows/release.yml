name: Build and Release APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Build Debug APK
        run: ./gradlew assembleDebug

      - name: Rename APK
        run: |
          VERSION="${GITHUB_REF_NAME:-v1.0.6}"
          cp app/build/outputs/apk/debug/app-debug.apk "entersend-$VERSION.apk"

      - name: Upload APK to Release
        if: github.event.repository.owner.login == 'warelock2'
        uses: softprops/action-gh-release@v1
        with:
          files: entersend-*.apk
          name: EnterSend ${{ github.ref_name }}
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
